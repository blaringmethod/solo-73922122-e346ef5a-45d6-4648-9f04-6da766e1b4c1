services:
  web:
    build: .
    image: ocr-label-migrator:latest
    container_name: ocr-label-migrator
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/app.db
    volumes:
      - appdata:/data
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  appdata:
